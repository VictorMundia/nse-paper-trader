<!doctype html>
<!-- This declares the page language as English. -->
<html lang="en">
  <head>
    <!-- This makes special characters like KES and emoji display correctly. -->
    <meta charset="UTF-8" />
    <!-- This makes the layout fit phone screens instead of zooming out. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This is the text shown on the browser tab. -->
    <title>NSE Paper Trader</title>
  </head>
  <!-- These classes set the page background and default text colour. -->
  <body class="bg-slate-50 text-slate-900 antialiased">
    <!-- React draws the whole app inside this element. -->
    <div id="root"></div>
    <!-- This loads the React entry file. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
